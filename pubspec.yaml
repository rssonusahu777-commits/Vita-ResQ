name: safereach
description: >
  SafeReach — Community Emergency Response Platform.
  Placeholder package name: com.example.safereach (rename before release).
version: 0.2.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

# ---------------------------------------------------------------------------
# Phase 1 — Pure Dart core (always active)
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter

  # --- Offline-first local storage (Phase 2) ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # --- GPS / Location (Phase 2) ---
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # --- State Management (Phase 2) ---
  flutter_riverpod: ^2.5.1

  # --- Firebase (Phase 3) ---
  # firebase_core: ^3.3.0
  # cloud_firestore: ^5.2.1
  # firebase_auth: ^5.1.4
  # firebase_messaging: ^15.0.4

  # --- Network reachability (Phase 3) ---
  # connectivity_plus: ^6.0.3

  # --- Sensor-based crash detection (Phase 6) ---
  # sensors_plus: ^4.1.1

# ---------------------------------------------------------------------------
# Dev dependencies
# ---------------------------------------------------------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

  # --- Code generation (enable when adding riverpod_annotation / hive_generator) ---
  # build_runner: ^2.4.9
  # riverpod_generator: ^2.4.0
  # hive_generator: ^2.0.1

flutter:
  uses-material-design: true
