name: vindara
description: >
  Vindara — Community Emergency Response Platform.
  Package identity: com.vindara.app.
version: 0.7.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter

  # --- Offline-first local storage (Phase 2) ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # --- GPS / Location (Phase 2) ---
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # --- State Management (Phase 2) ---
  flutter_riverpod: ^2.5.1

  # --- Firebase & Cloud Firestore (Phase 3) ---
  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.1
  firebase_auth: ^5.1.4

  # --- Network reachability & HTTP probe (Phase 3) ---
  connectivity_plus: ^6.0.3
  http: ^1.2.2

  # --- Push notifications & Local Heads-up (Phase 4) ---
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2

  # --- Navigation & Utilities (Phase 5) ---
  go_router: ^14.2.7
  url_launcher: ^6.3.0

  # --- Sensor-based crash detection (Phase 6) ---
  sensors_plus: ^6.1.1

  # --- Interactive Maps & Offline Coordinates (Phase 7) ---
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

# ---------------------------------------------------------------------------
# Dev dependencies
# ---------------------------------------------------------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
